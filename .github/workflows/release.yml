name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version: { description: 'version label (no publish on manual runs)', default: 'dev' }

env:
  GODOT_VERSION: 4.7.2
  NODE_VERSION: 22.23.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: ./node_modules/.bin/tsc --noEmit
      - run: ./node_modules/.bin/vitest run

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Godot
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - name: UI smoke test (every screen, campus scenario)
        run: |
          godot --headless --path godot --import || true
          GW_SMOKE=1 timeout 180 godot --headless --path godot 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" smoke.log

  export:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot + export templates
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          curl -fsSL -o templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          d=$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $d && unzip -q templates.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* $d/
      - name: Export
        run: |
          mkdir -p godot/build/linux godot/build/windows godot/build/macos
          godot --headless --path godot --import || true
          for p in Linux Windows macOS; do godot --headless --path godot --export-release "$p" || exit 1; done
          ls -R godot/build
      - uses: actions/upload-artifact@v4
        with: { name: godot-export, path: godot/build }

  package:
    needs: export
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux,       os: ubuntu-latest, node: linux-x64,   ext: tar.xz }
          - { target: windows,     os: ubuntu-latest, node: win-x64,     ext: zip }
          - { target: macos-arm64, os: macos-latest,  node: darwin-arm64, ext: tar.xz }
          - { target: macos-x64,   os: macos-latest,  node: darwin-x64,  ext: tar.xz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: godot-export, path: build }
      - name: Node runtime
        run: |
          f=node-v${NODE_VERSION}-${{ matrix.node }}
          curl -fsSL -o node.${{ matrix.ext }} https://nodejs.org/dist/v${NODE_VERSION}/$f.${{ matrix.ext }}
          mkdir node && if [ "${{ matrix.ext }}" = zip ]; then unzip -q node.zip -d node; else tar xf node.tar.xz -C node; fi
          mv node/$f nodedist
      - name: Package
        run: |
          ver=${GITHUB_REF_NAME}; [ "${GITHUB_REF_TYPE}" = tag ] || ver=${{ github.event.inputs.version || 'dev' }}
          scripts/package.sh ${{ matrix.target }} build/$(echo ${{ matrix.target }} | sed 's/-.*//') nodedist dist "$ver"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: dist-*, path: dist, merge-multiple: true }
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          ver=${GITHUB_REF_NAME#v}
          awk -v v="$ver" '/^## \[/{p=index($0,"["v"]")>0; next} p' CHANGELOG.md > notes.md
          printf '\n---\nDownload the archive for your OS, extract, and run. Node.js is bundled; nothing else to install.\n- **Windows**: unzip, run `GIGAWATT\\GIGAWATT.exe` (SmartScreen: More info, Run anyway; builds are unsigned).\n- **Linux (x86_64)**: `tar xf`, run `GIGAWATT/gigawatt.sh`. Needs a Vulkan-capable GPU/driver.\n- **macOS** (arm64 = Apple Silicon, x64 = Intel): unzip, then `xattr -dr com.apple.quarantine GIGAWATT.app` and open (builds are unsigned).\n' > tail.md
          [ -s notes.md ] || { echo "no CHANGELOG entry for $ver"; exit 1; }
          cat tail.md >> notes.md
      - run: cd dist && sha256sum * > SHA256SUMS.txt && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
